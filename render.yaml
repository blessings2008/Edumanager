services:
  - type: web
    name: edumanager-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.18.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @edumanager/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
